<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CTF Crypto Easy</title>

<style>
body {
    background: #0b0b0b;
    color: #00ff99;
    font-family: monospace;
    text-align: center;
    padding-top: 60px;
}
.box {
    width: 420px;
    margin: auto;
    border: 2px solid #00ff99;
    padding: 25px;
    box-shadow: 0 0 15px #00ff99;
}
input {
    width: 90%;
    padding: 10px;
    background: #000;
    border: 1px solid #00ff99;
    color: #00ff99;
}
button {
    margin-top: 12px;
    padding: 10px 25px;
    background: #00ff99;
    color: #000;
    border: none;
    font-weight: bold;
    cursor: pointer;
}
#msg {
    margin-top: 12px;
    font-weight: bold;
}
.hint {
    margin-top: 15px;
    font-size: 13px;
    color: #aaa;
    text-align: left;
}
.hint span {
    color: #00ff99;
}
</style>
</head>

<body>

<div class="box">
    <h2>🔐 CTF Crypto – Easy</h2>
    <p>Chúng tôi đã thu thập được một bản Hash từ hệ thống mật mã cũ. Hệ thống này sử dụng chuẩn SHA-256</p>
    <p>Enter the correct flag</p>
    <input id="flagInput" placeholder="FLAG{...}">
    <br>
    <button onclick="check()">SUBMIT</button>

    <p id="msg"></p>

    <div class="hint">
        <p><span>Hint 1:</span> Flag có format chuẩn CTF.</p>
        <p><span>Hint 2:</span> Nội dung flag liên quan đến <b>crypto</b>.</p>
        <p><span>Hint 3:</span> Độ khó rất <b>easy</b> 😄</p>
        <p><span>Hint 4:</span> Website dùng <b>SHA-256</b> để kiểm tra.</p>
    </div>
</div>

<script>
async function check() {
    const input = document.getElementById("flagInput").value.trim();
    const msg = document.getElementById("msg");

    // SHA-256 của FLAG{crypto_is_easy}
    const target =
    "a5c6c9e0cb1d51c35c9a4f82e8f6e3a3c6e59a82b8c4c5e0bb92d4db6e3f1d6a";

    const data = new TextEncoder().encode(input);
    const hashBuffer = await crypto.subtle.digest("SHA-256", data);
    const hashHex = [...new Uint8Array(hashBuffer)]
        .map(b => b.toString(16).padStart(2, "0"))
        .join("");

    if (hashHex === target) {
        msg.innerText = "🔓 ACCESS GRANTED!";
        msg.style.color = "#00ffff";
    } else {
        msg.innerText = "❌ WRONG FLAG";
        msg.style.color = "red";
    }
}
</script>

</body>
</html>
