<!DOCTYPE html>
<html>
<head>
    <title>CTF Crypto Level 2</title>
    <style>
        body { background: #050505; color: #00ff00; font-family: monospace; text-align: center; padding-top: 100px; }
        .box { border: 2px solid #00ff00; display: inline-block; padding: 20px; box-shadow: 0 0 15px #00ff00; }
        input { background: #000; border: 1px solid #00ff00; color: #00ff00; padding: 10px; width: 300px; }
        button { background: #00ff00; color: #000; border: none; padding: 10px 20px; font-weight: bold; cursor: pointer; }
        .hint-container {
    margin-top: 20px;
    text-align: left;
    display: inline-block;
}

.hint-icon {
    background: #4a6cf7;
    color: white;
    border-radius: 50%;
    padding: 0 5px;
    font-size: 12px;
}

.hint-buttons {
    display: flex;
    gap: 5px;
}

.hint-btn {
    background: #4f46e5; /* Màu tím đặc trưng */
    color: white;
    border: none;
    padding: 8px 15px;
    font-weight: bold;
    cursor: pointer;
    border-radius: 4px;
    transition: 0.3s;
}

.hint-btn:hover {
    background: #4338ca;
}

.hint-box {
    margin-top: 10px;
    padding: 10px;
    background: rgba(255, 255, 255, 0.05);
    border-left: 3px solid #4f46e5;
    color: #ccc;
    font-size: 13px;
    min-height: 20px;
    max-width: 300px;
}
        #launch-btn {
    background: linear-gradient(90deg, #22d3ee, #2dd4bf); /* Màu xanh giống ảnh */
    color: white;
    border: none;
    padding: 12px 30px;
    border-radius: 8px;
    font-weight: bold;
    cursor: pointer;
    font-size: 16px;
    transition: 0.3s;
}

#launch-btn:hover {
    opacity: 0.8;
    transform: scale(1.02);
}

.hint-btns button {
    background: #4f46e5; /* Màu tím giống ảnh */
    color: white;
    border: none;
    padding: 5px 15px;
    margin-right: 5px;
    border-radius: 4px;
    cursor: pointer;
}

.unlock-btn {
    background: #4f46e5;
    color: white;
    border: none;
    padding: 10px 20px;
    cursor: pointer;
    margin-top: 10px;
}
    </style>
</head>
<body>
    <div class="box">
    <h1>Web Exploitation: head-dump</h1>
    <p>Thử thách này yêu cầu bạn khởi tạo một phiên làm việc để lấy dữ liệu.</p>

    <div id="setup-area">
        <button id="launch-btn" onclick="launchInstance()">Launch Instance</button>
        <p id="status-text">Status: <span style="color: #ff4444;">NOT_RUNNING</span></p>
    </div>

    <div id="challenge-content" style="display: none;">
        <hr style="border: 0.5px solid #333; margin: 20px 0;">
        <p>Target Hash: <span style="color: #00ff00; font-family: monospace;">693630f9518671607f35316447c2343949989a07f6e090df42b937072a265147</span></p>
        
        <input type="text" id="flagInput" placeholder="Nhập Flag bạn tìm được...">
        <button class="unlock-btn" onclick="check()">SUBMIT FLAG</button>
        <p id="msg"></p>

        <div class="hint-section">
            <p>Hints <span class="hint-q">?</span></p>
            <div class="hint-btns">
                <button onclick="alert('Hint 1: Định dạng là FLAG{...}')">1</button>
                <button onclick="alert('Hint 2: Key là Crypto is the Key (viết kiểu l33t)')">2</button>
                <button onclick="alert('Hint 3: 2026')">3</button>
            </div>
        </div>
    </div>
</div>
    <script>
async function check() {
    try {
        // Đã bỏ dấu // và dấu ) dư thừa
        const input = document.getElementById('flagInput').value.trim();
        const msg = document.getElementById('msg'); // Đã sửa từ mgs thành msg
        
        const msgBuffer = new TextEncoder().encode(input);
        const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
        const hashArray = Array.from(new Uint8Array(hashBuffer));
        const hashHex = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');

        const target = "693630f9518671607f35316447c2343949989a07f6e090df42b937072a265147";

        if (hashHex === target) {
            msg.innerText = "🔓 ACCESS GRANTED!";
            msg.style.color = "cyan";
        } else {
            msg.innerText = "❌ ACCESS DENIED!";
            msg.style.color = "red";
        }
    } catch (e) {
        console.log(e);
    }
}

function launchInstance() {
    const btn = document.getElementById('launch-btn');
    const status = document.getElementById('status-text');

    btn.innerText = "Starting...";
    status.innerHTML = 'Status: <span style="color: orange;">STARTING</span>';

    setTimeout(() => {
        status.innerHTML = 'Status: <span style="color: #00ff00;">RUNNING</span>';
        document.getElementById('setup-area').style.display = 'none';
        document.getElementById('challenge-content').style.display = 'block';
    }, 1000);
}

function toggleHint(level) {
    alert("Hint " + level + " đã hiện trên màn hình!");
}

    </script>
</body>
</html>
